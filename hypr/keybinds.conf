# Programs
$terminal = kitty
$nnn=kitty -o allow_remote_control=yes --listen-on unix:/tmp/mykitty
$fileManager = $nnn --class="nnn" --execute nnn -a -d -e -P p
$menu = rofi -theme material -show run
$office = libreoffice
$music = audacious 
$browser = chromium
$drm_browser = firefox


# keybinds
# See https://wiki.hypr.land/Configuring/Keywords/
$mod = SUPER # Sets "Windows" key as main modifier
$modshift=$mod SHIFT 
$superctrlshift= CTRL $modshift

# essentials
bind = $mod, return, exec, $terminal
# refresh bar
bind = $modshift, r, exec, systemctl --user restart waybar hyprpaper
# kill window
bind = $modShift, Q, killactive,
# exit/logout
bind = $superctrlshift, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mod, t, exec, $fileManager
bind = $mod, space, togglefloating,
bind = $mod, d, exec, $menu
bind = $mod, p, pseudo, # dwindle
bind = $modshift, v, layoutmsg, togglesplit, # dwindle
bind = $modShift, s, exec, hyprshot -m region -o ~/Pictures/scrot-screenshots

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d
# fullscreen
bind = $mod, w, fullscreen, 1
bind = $mod, f , fullscreen
# move within groups
# bind = $mod alt, h,changegroupactive, b
# bind = $mod alt, l,changegroupactive, f


bind = $modshift, h, movewindow, l
bind = $modshift, l, movewindow, r
bind = $modshift, k, movewindow, u
bind = $modshift, j, movewindow, d

bind = $modshift, left, movewindow, l
bind = $modshift, right, movewindow, r
bind = $modshift, up, movewindow, u
bind = $modshift, down, movewindow, d

workspace= 1, 

# workspace names
$workspace1=1
$workspace2=2
$workspace3=3
$workspace4=4
$workspace5=5
$workspace6=6
$workspace7=7
$workspace8=8
$workspace9=9
$workspace0=name:0
$workspace_text=name:o
$discord=name:u

bind = $mod, c, exec, $terminal --class="clock" tty-clock -c -C7

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, $workspace1  
bind = $mod, 2, workspace, $workspace2  
bind = $mod, 3, workspace, $workspace3  
bind = $mod, 4, workspace, $workspace4  
bind = $mod, 5, workspace, $workspace5  
bind = $mod, 6, workspace, $workspace6  
bind = $mod, 7, workspace, $workspace7  
bind = $mod, 8, workspace, $workspace8  
bind = $mod, 9, workspace, $workspace9  
bind = $mod, 0, workspace, $workspace0 
bind = $mod, o, workspace, $workspace_text



# discord workspace
bind = $modshift, d, exec, discord
bind = $mod, u, workspace,$discord

bind = $modshift, u, movetoworkspace, $discord

# spotify workspace
bind = $mod, m, exec, $music



# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $modshift, 1, movetoworkspace, $workspace1
bind = $modshift, 2, movetoworkspace, $workspace2
bind = $modshift, 3, movetoworkspace, $workspace3
bind = $modshift, 4, movetoworkspace, $workspace4
bind = $modshift, 5, movetoworkspace, $workspace5
bind = $modshift, 6, movetoworkspace, $workspace6
bind = $modshift, 7, movetoworkspace, $workspace7
bind = $modshift, 8, movetoworkspace, $workspace8
bind = $modshift, 9, movetoworkspace, $workspace9
bind = $modshift, 0, movetoworkspace, $workspace0
bind = $modshift, o, movetoworkspace, $workspace_text

# open user applications
bind= $modshift, g, exec, $browser
bind= $modshift,c, exec, $browser --new-window chess.com
bind= $mod, g, exec, $drm_browser
bind = $mod, n , exec, $office

# use specific windows for applications


# open volume
bind= $mod,x,exec,pavucontrol

# Example special workspace (scratchpad)
# bind = $mod, S, togglespecialworkspace, magic
# bind = $mod SHIFT, S, movetoworkspace, special:magic

# window resizing
bind = $mod, r, submap, resizing
  # sub bind
  submap = resizing
  bind = $mod, h, movefocus, l
  bind = $mod, l, movefocus, r
  bind = $mod, k, movefocus, u
  bind = $mod, j, movefocus, d
  bind = $modshift,l, resizeactive,40 0
  bind = $modshift,k, resizeactive,0 -40
  bind = $modshift,j, resizeactive,0 40
  bind = $modshift,h, resizeactive,-40 0
  bind = ,escape,submap,reset
submap = reset



# who even uses the mouse anyways.

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# ok we keep this because zoom makes it atrocious to try and manage with a keyboard.

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
